name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  schedule:
    - cron: "0 6 1 * *"  # first of every month at 06:00 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tamnd/sicp-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SHA=${GITHUB_SHA::7}
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${DATE},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            $(docker build -q .) \
            bash -c "
              xelatex --version &&
              latexmk --version &&
              texi2any --version &&
              inkscape --version &&
              fc-list | grep -i inconsolata &&
              echo 'All checks passed'
            "
